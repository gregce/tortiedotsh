name: Refresh open-source metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: write

concurrency:
  group: refresh-open-source-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install LOC counter
        run: sudo apt-get update && sudo apt-get install --yes cloc

      - name: Refresh official GitHub metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node takes/three/scripts/refresh-open-source-metrics.mjs --loc

      - name: Commit changed fallback data
        run: |
          if git diff --quiet -- takes/three/src/data/open-source-metrics.json; then
            echo "Metrics are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add takes/three/src/data/open-source-metrics.json
          git commit -m "chore(data): refresh open-source project metrics"
          git push

      - name: Audit first-party evidence freshness
        run: npm --prefix takes/three run audit:freshness
