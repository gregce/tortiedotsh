name: Refresh comparison data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-open-source-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install LOC counter
        run: sudo apt-get update && sudo apt-get install --yes cloc

      - name: Refresh official forge metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: node scripts/refresh-open-source-metrics.mjs --loc

      - name: Refresh first-party evidence fingerprints
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --experimental-strip-types scripts/refresh-comparison-evidence.mjs

      - name: Validate refreshed comparison data
        run: npm run audit:freshness

      - name: Commit changed fallback data
        run: |
          if git diff --quiet -- src/data/open-source-metrics.json src/data/comparison-evidence-status.json; then
            echo "Metrics and source fingerprints are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/open-source-metrics.json src/data/comparison-evidence-status.json
          git commit -m "chore(data): refresh comparison evidence"
          git push
