name: Refresh repository LOC

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 0"

permissions:
  contents: write

concurrency:
  group: refresh-open-source-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install LOC counter
        run: sudo apt-get update && sudo apt-get install --yes cloc

      - name: Refresh repository metrics and LOC
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: node scripts/refresh-open-source-metrics.mjs --loc

      - name: Validate refreshed repository data
        run: npm run validate:data

      - name: Commit changed repository data
        run: |
          if git diff --quiet -- src/data/open-source-metrics.json; then
            echo "Repository metrics and LOC are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/open-source-metrics.json
          git commit -m "chore(data): refresh repository LOC"
          git pull --rebase origin main
          git push
