name: Monitor comparison evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "47 8 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-comparison-evidence
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh first-party evidence fingerprints
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --experimental-strip-types scripts/refresh-comparison-evidence.mjs

      - name: Validate evidence registry structure
        run: npm run validate:data

      - name: Summarize evidence review status
        run: npm run report:evidence

      - name: Commit changed evidence status
        run: |
          if git diff --quiet -- src/data/comparison-evidence-status.json; then
            echo "Evidence fingerprints are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/comparison-evidence-status.json
          git commit -m "chore(data): refresh comparison evidence"
          git pull --rebase origin main
          git push
